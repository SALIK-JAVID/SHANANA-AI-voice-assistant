<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="682" viewBox="0 0 2048 682" role="img" aria-label="Shanana Virtual AI Assistant banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b9762e"/>
      <stop offset="55%" stop-color="#5b58a8"/>
      <stop offset="100%" stop-color="#1f44ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="2048" height="682" fill="url(#bg)"/>

  <!-- Left tile -->
  <rect x="260" y="78" width="620" height="526" rx="64" fill="#ffffff"/>
  <text x="570" y="390" text-anchor="middle" font-size="180" font-weight="700" fill="#8a717b"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    AI
  </text>

  <!-- Title -->
  <text x="1110" y="340" font-size="200" font-weight="700" fill="#ffffff"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        style="font-style: italic;">
    Shanana
  </text>
  <text x="1120" y="410" font-size="44" fill="#ffffff" opacity="0.92"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        letter-spacing="14">
    VIRTUAL AI ASSISTANT
  </text>
</svg>
